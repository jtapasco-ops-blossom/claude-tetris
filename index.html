<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle">&#x2600; Light</button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="name-entry" class="name-entry hidden">
          <span class="label">NUEVO RÉCORD</span>
          <input id="name-input" type="text" maxlength="8" placeholder="TU NOMBRE" />
          <button id="save-score-btn">Guardar</button>
        </div>

        <div id="records" class="records">
          <span class="label">RÉCORDS</span>
          <table id="records-table">
            <thead>
              <tr><th>#</th><th>Nombre</th><th>Score</th><th>Líneas</th></tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>
          <div class="records-stats">
            <span class="label">MEJOR COMBO: <span id="best-combo">0</span></span>
            <span class="label">MÁX LÍNEAS: <span id="max-lines">0</span></span>
          </div>
        </div>

        <div class="overlay-actions">
          <button id="restart-btn">Reiniciar</button>
          <button id="reset-records-btn">Borrar récords</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
